<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DäckHem – Avboka</title><style>body{font:16px system-ui;background:#0c1726;color:#eef4fb;margin:0;padding:32px}main{max-width:650px;margin:40px auto;background:#15263b;padding:30px;border-radius:16px}a{color:#f5b942}button{background:#f5b942;color:#152235;border:0;border-radius:9px;padding:14px;font-weight:700;cursor:pointer}input{width:100%;box-sizing:border-box;background:#0e1b2c;color:white;border:1px solid #43566c;padding:12px;margin:10px 0 20px}p{line-height:1.6}</style></head><body><main><a href="/">← DäckHem</a><h1>Avboka din bokning</h1><p>Du kan avboka mer än 7 timmar före besöket. Avbokningslänken är personlig.</p><form id="form"><label for="token">Avbokningsnyckel</label><input id="token" required autocomplete="off"><button type="submit">Bekräfta avbokning</button></form><p id="status" role="status" aria-live="polite"></p></main><script>
const input=document.getElementById('token'),form=document.getElementById('form'),status=document.getElementById('status');
const params=new URLSearchParams(location.hash.slice(1));
if(params.has('token')){input.value=params.get('token');history.replaceState(null,'',location.pathname);}
form.addEventListener('submit',async e=>{e.preventDefault();const token=input.value.trim();if(!token)return;const button=form.querySelector('button');button.disabled=true;status.textContent='Avbokar…';try{const r=await fetch('/api/bookings/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(r.ok){status.textContent='Din bokning är avbokad.';input.value='';}else{const msg=await r.text();status.textContent=msg.replace(/^"|"$/g,'')||'Avbokningen misslyckades.';}}catch{status.textContent='Kunde inte kontakta servern.';}finally{button.disabled=false;}});
</script></body></html>
