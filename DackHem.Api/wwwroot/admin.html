<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DäckHem Admin</title><style>
body{font:16px system-ui;background:#0c1726;color:#eef4fb;margin:0;padding:32px}main{max-width:1200px;margin:auto}a{color:#f5b942}.panel{background:#15263b;padding:24px;border-radius:12px;margin:20px 0}input{padding:12px;border-radius:6px}button{padding:12px;background:#f5b942;border:0;border-radius:6px;cursor:pointer;margin:6px}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border-bottom:1px solid #43566c;padding:10px;text-align:left}th{color:#f5b942}.conflict{background:#49351c}.warning{background:#49351c;border:1px solid #f5b942;border-radius:8px;padding:12px;margin:12px 0}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}.filters input,.filters select{padding:10px;border-radius:6px;background:#fff;color:#111}.filters label{display:flex;gap:6px;align-items:center}.edit{background:#263c54;color:#fff;border:1px solid #f5b942;padding:7px}.reschedule{margin:16px 0;padding:16px;border:1px solid #f5b942;border-radius:8px}.reschedule input{margin:8px}.workPanel{border:1px solid #f5b942;padding:16px;border-radius:8px;margin:14px 0}.workPanel label{display:block;margin:10px 0}.workPanel select,.workPanel textarea{padding:9px;border-radius:6px;max-width:100%;width:300px}.workPanel textarea{width:420px;height:65px}.inlineWork{display:flex;flex-direction:column;gap:6px;position:absolute;right:0;top:100%;z-index:10;width:205px;box-sizing:border-box;padding:12px;background:#263c54;border:1px solid #f5b942;border-radius:8px;box-shadow:0 6px 20px #0009}.workActions{position:relative;min-width:145px}.inlineWork button{margin:3px 0}.inlineWork select{max-width:150px;padding:7px;border-radius:6px;background:white;color:#111}.inlineWork textarea{max-width:160px;min-height:54px;border-radius:6px;padding:6px}.inlineWork small{font-size:12px}.inlineTime{width:240px}.inlineTime input{width:100%;box-sizing:border-box;padding:7px;border-radius:6px}.inlineTime small{line-height:1.4}.workBadge{font-weight:bold}.scroll{overflow-x:auto}[hidden]{display:none!important}
</style></head><body><main><a href="/">Tillbaka till DäckHem</a><h1>Admin – bokningar</h1><p>Endast för administratören.</p><div class="panel" id="login"><form id="loginForm"><label>Adminnyckel <input id="key" type="password" required autocomplete="off"></label><button>Visa bokningar</button></form></div><p id="message" role="status"></p><div class="panel" id="result" hidden><button id="refresh">Uppdatera</button><button id="lock">Lås</button><p id="count"></p><div class="filters"><label>Sök kund <input id="search" type="search" placeholder="Namn, telefon eller regnummer"></label><label>Status <select id="status"><option value="all">Alla</option><option value="Confirmed">Aktiva</option><option value="Cancelled">Avbokade</option></select></label><label>Sortering <select id="sort"><option value="upcoming">Kommande först</option><option value="newest">Senaste datum först</option></select></label></div><p id="filteredCount"></p><p>Obs: sökning och filtrering gäller de 30 bokningarna på aktuell sida.</p><div id="conflicts" role="status" hidden></div><div class="reschedule" id="editPanel" hidden><h2>Ändra bokningstid</h2><p id="editCustomer"></p><form id="editForm"><label>Ny tid <input id="newTime" type="datetime-local" required></label><button type="submit">Spara och mejla kunden</button><button type="button" id="cancelEdit">Avbryt</button></form><p id="editMessage" role="status"></p></div><div class="workPanel" id="workPanel" hidden><h2>Uppdatera arbete</h2><p id="workCustomer"></p><form id="workForm"><label>Arbetsstatus <select id="workStatus"><option value="Waiting">Väntar</option><option value="InProgress">Pågår</option><option value="Done">Klar</option></select></label><label>Ansvarig <select id="assignedTo"><option value="">Ingen vald</option><option value="Owner">Jag</option><option value="Colleague">Kollegan</option></select></label><label>Intern kommentar <textarea id="internalNote" maxlength="1000" placeholder="Syns bara i adminpanelen"></textarea></label><button type="submit">Spara</button><button type="button" id="closeWork">Stäng</button></form><p id="workMessage" role="status"></p></div><div class="scroll"><table><thead><tr><th>Tid</th><th>Status</th><th>Namn</th><th>Telefon</th><th>E-post</th><th>Regnummer</th><th>Adress</th><th>Pris</th><th>Övrigt</th><th>Arbete</th><th>Ansvarig</th><th>Intern kommentar</th><th>Åtgärd</th></tr></thead><tbody id="rows"></tbody></table></div><button id="prev">Föregående</button><span id="page"></span><button id="next">Nästa</button></div></main>
<script>
const el=id=>document.getElementById(id);
let key='',page=1,total=0,currentBookings=[];
function addCell(tr,value){const td=document.createElement('td');td.textContent=String(value??'');tr.appendChild(td);}
async function load(){
 el('message').textContent='Hämtar bokningar...';
 try{
 const response=await fetch('/api/admin/bookings?page='+page+'&pageSize=30',{headers:{'X-Admin-Key':key},cache:'no-store'});
 if(!response.ok){const error=await response.json();if(response.status===401){key='';el('result').hidden=true;el('login').hidden=false;}throw Error(error.message||'Kunde inte hämta bokningar.');}
 const data=await response.json();total=data.total;currentBookings=data.bookings;el('editPanel').hidden=true;editingId=null;el('workPanel').hidden=true;workingId=null;
 renderBookings();

 el('count').textContent=total+' bokningar';el('page').textContent=' Sida '+page+' ';el('prev').disabled=page===1;el('next').disabled=page*30>=total;el('login').hidden=true;el('result').hidden=false;el('message').textContent='Bokningarna är uppdaterade.';
 }catch(error){el('message').textContent=error.message||'Ett fel uppstod.';}
}
function renderBookings(){
 const q=el('search').value.trim().toLocaleLowerCase('sv-SE');
 const status=el('status').value;
 const now=new Date();
 const todayLocal=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);
 const filtered=currentBookings.filter(b=>(status==='all'||b.status===status)&&
  [b.customerName,b.phoneNumber,b.registrationNumber].some(v=>String(v??'').toLocaleLowerCase('sv-SE').includes(q)));
 filtered.sort((a,b)=>{
  const x=a.bookingDateTime||'',y=b.bookingDateTime||'';
  if(el('sort').value==='newest')return y.localeCompare(x);
  const ax=x>=todayLocal,by=y>=todayLocal;
  if(ax!==by)return ax?-1:1;
  return ax?x.localeCompare(y):y.localeCompare(x);
 });
 el('rows').replaceChildren();
 const counts=new Map();
 for(const b of currentBookings){
  if(b.status==='Cancelled'||!b.bookingDateTime)continue;
  const t=b.bookingDateTime.slice(0,16);counts.set(t,(counts.get(t)||0)+1);
 }
 const box=el('conflicts');box.replaceChildren();
 const clashes=[...counts].filter(([,count])=>count>1);
 if(clashes.length){
  box.hidden=false;box.className='warning';
  const h=document.createElement('strong');h.textContent='⚠ Flera aktiva bokningar på samma tid (den här sidan)';box.appendChild(h);
  const ul=document.createElement('ul');
  for(const [t,count] of clashes){const li=document.createElement('li');li.textContent=t.replace('T',' ')+' – '+count+' kunder. Kontakta kunderna om du behöver flytta en tid.';ul.appendChild(li);}
  box.appendChild(ul);
 }else{box.hidden=true;box.className='';}
 for(const b of filtered){
  const tr=document.createElement('tr');
  if(b.status!=='Cancelled'&&(counts.get(b.bookingDateTime?.slice(0,16))||0)>1){tr.classList.add('conflict');tr.title='Flera aktiva bokningar på samma tid';}
  const timeCell=document.createElement('td');timeCell.textContent=b.bookingDateTime?.replace('T',' ').slice(0,16)||'';tr.appendChild(timeCell);
  for(const value of [b.status==='Cancelled'?'Avbokad':'Bekräftad',b.customerName,b.phoneNumber,b.email,b.registrationNumber,b.address,b.price+' kr',b.notes])addCell(tr,value);
  const workCell=document.createElement('td');workCell.textContent=b.status==='Cancelled'?'Avbokad':({Waiting:'Väntar',InProgress:'Pågår',Done:'Klar'}[b.workStatus]||'Väntar');tr.appendChild(workCell);
  const assigneeCell=document.createElement('td');assigneeCell.textContent=({Owner:'Mesgun',Colleague:'Semere'}[b.assignedTo]||'–');tr.appendChild(assigneeCell);
  const noteCell=document.createElement('td');noteCell.textContent=b.internalNote||'';tr.appendChild(noteCell);
  if(b.status!=='Cancelled'){
   const td=document.createElement('td'),button=document.createElement('button');const actions=document.createElement('div');actions.className='workActions';td.appendChild(actions);
   button.className='edit';button.type='button';button.textContent='Ändra tid';
   button.addEventListener('click',()=>{
    const existing=actions.querySelector('.inlineTime');
    if(existing){existing.remove();return;}
    actions.querySelector('.inlineWork')?.remove();
    const box=document.createElement('div');box.className='inlineWork inlineTime';
    const label=document.createElement('label');label.textContent='Ny tid (svensk tid)';
    const dateInput=document.createElement('input');dateInput.type='datetime-local';dateInput.required=true;
    dateInput.value=b.bookingDateTime.slice(0,16);label.appendChild(dateInput);
    const save=document.createElement('button');save.type='button';save.textContent='Spara och mejla';
    const close=document.createElement('button');close.type='button';close.textContent='Stäng';
    const hint=document.createElement('small');hint.setAttribute('role','status');hint.textContent='Kontakta kunden och kom överens om ny tid först.';
    close.addEventListener('click',()=>box.remove());
    save.addEventListener('click',async()=>{
     const time=dateInput.value;
     if(!time){hint.textContent='Välj datum och tid.';return;}
     if(!confirm('Har du kommit överens med kunden om den nya tiden? Ett mejl skickas till kunden.'))return;
     save.disabled=true;close.disabled=true;dateInput.disabled=true;hint.textContent='Sparar...';
     try{
      const response=await fetch('/api/admin/bookings/'+encodeURIComponent(b.id)+'/reschedule',{
       method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Key':key},
       body:JSON.stringify({bookingDateTime:time+':00'}),cache:'no-store'
      });
      const data=await response.json();if(!response.ok)throw Error(data.message||'Kunde inte ändra bokningen.');
      b.bookingDateTime=data.bookingDateTime;
      timeCell.textContent=b.bookingDateTime.replace('T',' ').slice(0,16);
      box.remove();el('message').textContent=data.message;
      // Recalculate time conflicts and sorting without scrolling the page.
      const scroll=el('rows').closest('.scroll'),scrollLeft=scroll.scrollLeft,scrollTop=window.scrollY;
      renderBookings();scroll.scrollLeft=scrollLeft;window.scrollTo(window.scrollX,scrollTop);
     }catch(error){hint.textContent=error.message||'Ett fel uppstod.';}
     finally{save.disabled=false;close.disabled=false;dateInput.disabled=false;}
    });
    box.append(label,save,close,hint);actions.appendChild(box);
   });actions.appendChild(button);const workButton=document.createElement('button');workButton.className='edit';workButton.type='button';workButton.textContent='Uppdatera arbete';workButton.addEventListener('click',()=>{
    const existing=td.querySelector('.inlineWork:not(.inlineTime)');
    if(existing){existing.remove();return;}
    actions.querySelector('.inlineTime')?.remove();
    const box=document.createElement('div');box.className='inlineWork';
    const statusSelect=document.createElement('select');
    for(const [value,label] of [['Waiting','Väntar'],['InProgress','Pågår'],['Done','Klar']]){
     const option=document.createElement('option');option.value=value;option.textContent=label;statusSelect.appendChild(option);
    }
    statusSelect.value=b.workStatus||'Waiting';statusSelect.setAttribute('aria-label','Arbetsstatus');
    const assigneeSelect=document.createElement('select');
    for(const [value,label] of [['','Ingen vald'],['Owner','Mesgun'],['Colleague','Semere']]){
     const option=document.createElement('option');option.value=value;option.textContent=label;assigneeSelect.appendChild(option);
    }
    assigneeSelect.value=b.assignedTo||'';assigneeSelect.setAttribute('aria-label','Ansvarig');
    const note=document.createElement('textarea');note.maxLength=1000;note.placeholder='Intern kommentar';note.value=b.internalNote||'';
    const hint=document.createElement('small');hint.setAttribute('role','status');hint.textContent='Välj alternativ och klicka på Spara.';
    async function saveWork(){
     statusSelect.disabled=true;assigneeSelect.disabled=true;note.disabled=true;saveButton.disabled=true;hint.textContent='Sparar...';
     const next={workStatus:statusSelect.value,assignedTo:assigneeSelect.value,internalNote:note.value};
     try{
      const response=await fetch('/api/admin/bookings/'+encodeURIComponent(b.id)+'/work',{
       method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Key':key},
       body:JSON.stringify(next),cache:'no-store'
      });
      const data=await response.json();if(!response.ok)throw Error(data.message||'Kunde inte spara.');
      Object.assign(b,next);
      workCell.textContent=({Waiting:'Väntar',InProgress:'Pågår',Done:'Klar'}[b.workStatus]||'Väntar');
      assigneeCell.textContent=({Owner:'Mesgun',Colleague:'Semere'}[b.assignedTo]||'–');
      noteCell.textContent=b.internalNote||'';
      box.remove();el('message').textContent='Arbetet sparades för '+b.customerName+'.';
     }catch(error){
      statusSelect.value=b.workStatus||'Waiting';assigneeSelect.value=b.assignedTo||'';note.value=b.internalNote||'';
      hint.textContent=error.message||'Kunde inte spara.';
     }finally{statusSelect.disabled=false;assigneeSelect.disabled=false;note.disabled=false;saveButton.disabled=false;}
    }
    const saveButton=document.createElement('button');saveButton.type='button';saveButton.textContent='Spara';
    saveButton.addEventListener('click',saveWork);
    box.append(statusSelect,assigneeSelect,note,saveButton,hint);actions.appendChild(box);
   });actions.appendChild(workButton);tr.appendChild(td);
  }else addCell(tr,'–');
  el('rows').appendChild(tr);
 }
 el('filteredCount').textContent='Visar '+filtered.length+' av '+currentBookings.length+' bokningar på sidan.';
}
let workingId=null;
function openWork(b){
 workingId=b.id;el('workCustomer').textContent='Kund: '+b.customerName+' – '+b.registrationNumber;
 el('workStatus').value=b.workStatus||'Waiting';el('assignedTo').value=b.assignedTo||'';
 el('internalNote').value=b.internalNote||'';el('workMessage').textContent='';
 el('workPanel').hidden=false;el('workPanel').scrollIntoView({behavior:'smooth',block:'nearest'});
}
el('closeWork').addEventListener('click',()=>{workingId=null;el('workPanel').hidden=true;});
el('workForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!workingId)return;
 const submit=el('workForm').querySelector('[type=submit]');submit.disabled=true;
 el('workMessage').textContent='Sparar...';
 try{
  const response=await fetch('/api/admin/bookings/'+encodeURIComponent(workingId)+'/work',{
   method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Key':key},
   body:JSON.stringify({workStatus:el('workStatus').value,assignedTo:el('assignedTo').value,internalNote:el('internalNote').value}),cache:'no-store'
  });
  const data=await response.json();if(!response.ok)throw Error(data.message||'Kunde inte spara.');
  workingId=null;el('workPanel').hidden=true;await load();el('message').textContent='Arbetsstatus sparad.';
 }catch(error){el('workMessage').textContent=error.message||'Ett fel uppstod.';}
 finally{submit.disabled=false;}
});
let editingId=null;
function openEdit(b){
 editingId=b.id;el('editCustomer').textContent='Kund: '+b.customerName+' | Nuvarande tid: '+b.bookingDateTime.replace('T',' ').slice(0,16);
 el('newTime').value=b.bookingDateTime.slice(0,16);el('editMessage').textContent='';
 el('editPanel').hidden=false;el('editPanel').scrollIntoView({behavior:'smooth',block:'nearest'});
}
el('cancelEdit').addEventListener('click',()=>{editingId=null;el('editPanel').hidden=true;});
el('editForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!editingId)return;
 const time=el('newTime').value;
 if(!time||!confirm('Har du kommit överens med kunden om den nya tiden? Ett mejl skickas till kunden.'))return;
 const submit=el('editForm').querySelector('[type=submit]');submit.disabled=true;el('editMessage').textContent='Sparar ändringen...';
 try{
  const response=await fetch('/api/admin/bookings/'+encodeURIComponent(editingId)+'/reschedule',{
   method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Key':key},
   body:JSON.stringify({bookingDateTime:time+':00'}),cache:'no-store'
  });
  const data=await response.json();
  if(!response.ok)throw Error(data.message||'Kunde inte ändra bokningen.');
  editingId=null;el('editPanel').hidden=true;await load();el('message').textContent=data.message;
 }catch(error){el('editMessage').textContent=error.message||'Ett fel uppstod.';}
 finally{submit.disabled=false;}
});
for(const id of ['search','status','sort'])el(id).addEventListener(id==='search'?'input':'change',renderBookings);
el('loginForm').addEventListener('submit',async e=>{e.preventDefault();key=el('key').value;el('key').value='';page=1;await load();});
el('refresh').addEventListener('click',load);
el('prev').addEventListener('click',()=>{if(page>1){page--;load();}});
el('next').addEventListener('click',()=>{if(page*30<total){page++;load();}});
el('lock').addEventListener('click',()=>{key='';workingId=null;el('workPanel').hidden=true;editingId=null;el('editPanel').hidden=true;currentBookings=[];el('rows').replaceChildren();el('conflicts').hidden=true;el('result').hidden=true;el('login').hidden=false;el('message').textContent='Adminpanelen är låst.';});
</script></body></html>
