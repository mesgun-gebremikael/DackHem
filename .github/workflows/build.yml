name: Build DackHem
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore DackHem.Api/DackHem.Api.csproj
      - run: dotnet build DackHem.Api/DackHem.Api.csproj --configuration Release --no-restore
